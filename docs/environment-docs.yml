name: terminal-docs
channels:
  - conda-forge
dependencies:
  # General build dependencies
  - micromamba
  - nodejs =24
  - python =3.14

  # Jupyter dependencies
  - jupyterlite-core >=0.8,<0.9.0

  # Docs dependencies
  - jupyterlite-sphinx
  - myst-parser
  - pydata-sphinx-theme
  - sphinx

  # Deployment dependencies
  - catppuccin-jupyterlab
